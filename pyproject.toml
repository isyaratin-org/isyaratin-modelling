[project]
name = "isyaratin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==0.10.9",
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "opencv-python",
    "scikit-learn",
    "tqdm>=4.70.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
    "onnx>=1.17.0",
    "onnxruntime>=1.26.0",
    "onnx2tf>=1.28.8",
    "tf-keras>=2.19.0",
    "seaborn>=0.13.2",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# Wheel CUDA resmi PyTorch. Jangan pakai wheel PyPI biasa: di Windows itu
# build CPU-only, jadi GPU nggak kepakai sama sekali.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

